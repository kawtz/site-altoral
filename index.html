<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitMode - Moda Fitness</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #1f1f1f;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    nav {
      background-color: #333;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      color: #ff4081;
    }
    .banner {
      background-image: url('https://images.unsplash.com/photo-1605296867304-46d5465a13f1');
      background-size: cover;
      background-position: center;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }
    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .produto {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .produto img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }
    .produto h3 {
      margin: 10px 0;
      font-size: 1.2rem;
    }
    .produto p {
      color: #ff4081;
      font-weight: bold;
      font-size: 1.1rem;
    }
    footer {
      background-color: #1f1f1f;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>FitMode</h1>
    <p>Estilo e conforto para sua rotina fitness</p>
  </header>
  <nav>
    <a href="#">Início</a>
    <a href="#">Coleção</a>
    <a href="#">Ofertas</a>
    <a href="#">Contato</a>
  </nav>
  <section class="banner">
    <div>Vista sua melhor versão</div>
  </section>
  <section class="produtos">
    <div class="produto">
      <img src="fit/rosa.webp" alt= "Conjunto Fitness Rosa">
      <h3>Conjunto Fitness Rosa</h3>
      <p>R$ 149,90</p>
    </div>
    <div class="produto">
      <img src="https://images.unsplash.com/photo-1554284126-aa88f22d8b74" alt="Top Preto Power">
      <h3>Top Preto Power</h3>
      <p>R$ 89,90</p>
    </div>
    <div class="produto">
      <img src="fit/cinza.webp" alt="Legging Conforto Cinza">
      <h3>Legging Conforto Cinza</h3>
      <p>R$ 119,90</p>
    </div>
  </section>
  <footer>
    <p>&copy; 2025 FitMode - Todos os direitos reservados</p>
  </footer>
</body>
</html>
